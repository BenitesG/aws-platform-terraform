# Componente de Docker Engine.
#
# Docker NAO entra na imagem base, de proposito: o daemon roda como root, e
# pertencer ao grupo "docker" equivale a ser root - da para montar o
# filesystem do host dentro de um container. Receita separada, empilhada
# sobre a base.
#
# ---------------------------------------------------------------------------
# O PONTO CENTRAL DESTE COMPONENTE E O LIMITE DE LOG, NAO A REDE
# ---------------------------------------------------------------------------
#
# log-opts com max-size 10m e max-file 3 e o que tem valor pratico aqui: sem
# limite, um container que loga muito enche o disco raiz de 20 GB e derruba a
# maquina. O sintoma e "o servidor parou", sem causa obvia - e e MUITO mais
# provavel que qualquer colisao de faixa de rede.
#
# live-restore mantem os containers rodando quando o daemon reinicia.
#
# O POOL DE ENDERECOS FICOU NO PADRAO DO DOCKER. A versao 1.0.0 fixava
# 10.100.0.0/16 e 10.101.0.0/16; foi revertido em 15/10/2026 porque a
# justificativa estava errada - detalhes na nota ao fim deste arquivo.
#
# A fase validate NAO confia na configuracao: ela confere que o daemon
# realmente LEU o daemon.json. E a diferenca entre "configuramos" e "esta
# valendo", e foi ela que pegou um bug real de ordem dos passos.

name: docker
description: Docker Engine com limite de log e live-restore
schemaVersion: 1.0

phases:
  - name: build
    steps:

      # Pacotes de distribuicao que conflitam com o docker-ce oficial.
      # O "|| true" existe porque apt-get remove de pacote ausente sai com
      # codigo diferente de zero, e no ExecuteBash isso reprova o passo todo.
      - name: RemoveConflicts
        action: ExecuteBash
        inputs:
          commands:
            - |
              for pkg in docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc; do
                apt-get remove -y "$pkg" 2>/dev/null || true
              done

      - name: InstallPrereqs
        action: ExecuteBash
        inputs:
          commands:
            - apt-get update -y
            - apt-get install -y ca-certificates curl gnupg
            - install -d -m 0755 /etc/apt/keyrings
            - install -d -m 0755 /etc/docker

      # ORDEM: o daemon.json e escrito ANTES de instalar o docker-ce.
      #
      # POR QUE: o "apt install docker-ce" JA SOBE O DAEMON. Escrevendo antes,
      # a primeira subida ja le a configuracao e nao e preciso reiniciar.
      #
      # Isso tambem evita uma classe de erro: configuracao que so vale para
      # recursos criados DEPOIS dela passar a valer nao se aplica ao que o
      # daemon ja criou. Foi o que derrubou a build 1.0.0/1, quando este
      # componente ainda fixava o default-address-pools - ver a nota no fim.
      #
      # log-opts limita o log de container. E o campo que mais importa aqui:
      # sem ele, um container que loga muito enche o disco raiz de 20 GB e
      # derruba a maquina, com sintoma "o servidor parou" sem causa obvia.
      #
      # live-restore mantem os containers rodando quando o daemon reinicia -
      # util num host de container, e inofensivo (so e incompativel com swarm
      # mode, que nao usamos).
      - name: ConfigureDaemon
        action: CreateFile
        inputs:
          - path: /etc/docker/daemon.json
            overwrite: true
            content: |
              {
                "log-driver": "json-file",
                "log-opts": {
                  "max-size": "10m",
                  "max-file": "3"
                },
                "live-restore": true
              }

      # Chave GPG e repositorio, com DETECCAO DE CODINOME E FALLBACK.
      #
      # Por que num passo unico: cada ExecuteBash roda num shell proprio,
      # entao variavel definida num passo nao sobrevive para o seguinte.
      #
      # O risco e real e esta registrado no A24: repositorios de TERCEIROS
      # costumam atrasar meses para publicar pacote para codinome de LTS novo.
      # O Ubuntu 26.04 e "resolute". Se a Docker ainda nao tiver canal para
      # ele, cair em "noble" (24.04 LTS) e o contorno padrao - o pacote e
      # compativel, e o alternativa seria a build falhar inteira.
      #
      # O codinome efetivo fica no log, entao da para saber depois se a imagem
      # usou resolute ou o fallback.
      - name: AddDockerRepository
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -eu
              . /etc/os-release
              CODENAME="${UBUNTU_CODENAME:-}"
              if [ -z "$CODENAME" ]; then
                CODENAME="$(lsb_release -cs)"
              fi
              echo "codinome do SO: ${CODENAME}"

              if curl -fsI "https://download.docker.com/linux/ubuntu/dists/${CODENAME}/Release" >/dev/null 2>&1; then
                echo "canal do Docker para ${CODENAME}: existe"
              else
                echo "AVISO: a Docker ainda nao publicou canal para ${CODENAME}."
                echo "AVISO: usando o canal do noble (24.04 LTS) como contorno."
                CODENAME="noble"
              fi
              echo "codinome efetivo do repositorio: ${CODENAME}"

              curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              chmod a+r /etc/apt/keyrings/docker.gpg

              printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu %s stable\n' \
                "$(dpkg --print-architecture)" "$CODENAME" \
                > /etc/apt/sources.list.d/docker.list

              cat /etc/apt/sources.list.d/docker.list

      - name: InstallDocker
        action: ExecuteBash
        inputs:
          commands:
            - apt-get update -y
            - apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

      # O daemon.json JA FOI ESCRITO antes da instalacao - ver a nota em
      # ConfigureDaemon. Aqui so garantimos que o servico esta habilitado para
      # subir no boot da instancia final.
      #
      # Nao ha "restart" porque nao e preciso: o daemon subiu pela primeira vez
      # ja lendo a configuracao correta.
      - name: EnableDocker
        action: ExecuteBash
        inputs:
          commands:
            - systemctl enable docker
            - systemctl is-active docker

      # NAO acrescentamos ninguem ao grupo "docker" aqui, e isso e deliberado.
      #
      # Pertencer ao grupo docker equivale a ser root na maquina. Quem precisar
      # usar o Docker entra pelo Session Manager, onde o ssm-user ja tem sudo.
      # Colocar usuario no grupo na IMAGEM daria esse poder a toda instancia
      # criada dela, para sempre, sem decisao caso a caso.

  # -------------------------------------------------------------------------
  # validate: roda na instancia de BUILD, antes de tirar a AMI.
  # Falhar aqui impede a AMI de existir, que e o que queremos.
  # -------------------------------------------------------------------------
  - name: validate
    steps:
      - name: ValidateDockerInstalled
        action: ExecuteBash
        inputs:
          commands:
            - docker --version
            - docker compose version
            - systemctl is-active docker
            - systemctl is-enabled docker

      - name: ValidateDaemonConfig
        action: ExecuteBash
        inputs:
          commands:
            - cat /etc/docker/daemon.json

      # A CONFERENCIA QUE IMPORTA: o daemon.json SURTIU EFEITO?
      #
      # Nao basta o arquivo estar escrito - o "cat" do passo anterior provaria
      # apenas isso. E preciso que o daemon tenha LIDO e aplicado.
      #
      # Foi esta distincao que pegou o bug da build 1.0.0/1: o arquivo estava
      # correto no disco e a configuracao nao estava valendo, porque o daemon
      # havia subido antes de ele existir.
      #
      # UMA VERIFICACAO SO, DE PROPOSITO. "Live Restore Enabled: true" so
      # aparece se veio do daemon.json - o padrao do Docker e false. Se o
      # daemon leu o arquivo, leu o log-opts tambem: estao no mesmo arquivo.
      #
      # A versao 1.0.1 tinha um segundo passo que subia um container e lia o
      # LogConfig com "grep -A3". A janela de 3 linhas cortava antes do
      # max-size, e a build 1.0.1/1 FOI REPROVADA por engano - a configuracao
      # estava correta. Verificador complicado vira fonte de falha em vez de
      # detector. Removido.
      - name: ValidateDaemonTookEffect
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -eu

              if ! docker info 2>/dev/null | grep -q 'Live Restore Enabled: true'; then
                echo "ERRO: o daemon nao esta com live-restore ativo."
                echo "ERRO: o /etc/docker/daemon.json nao surtiu efeito."
                echo "ERRO: causa provavel - o daemon subiu antes de o arquivo existir."
                echo "--- docker info ---"
                docker info 2>&1 || true
                exit 1
              fi
              echo "OK: live-restore ativo - o daemon.json foi lido e aplicado."

              # Informativo, nao bloqueante: registra a faixa do docker0 para
              # quem for diagnosticar roteamento nesta instancia um dia. Com o
              # pool PADRAO do Docker, o esperado e 172.17.0.0/16.
              echo "INFO: rede do docker0: $(docker network inspect bridge | grep '"Subnet"' | head -1 | cut -d'"' -f4)"

  # -------------------------------------------------------------------------
  # test: roda numa instancia lancada a partir da AMI JA PRONTA.
  # E o que diferencia "imagem criada" de "imagem que comprovadamente funciona".
  # -------------------------------------------------------------------------
  - name: test
    steps:
      # Exige saida na 443 para o registry. O security group da build libera
      # 443 e 80, e a saida existe pelo NAT.
      - name: TestRunContainer
        action: ExecuteBash
        inputs:
          commands:
            - docker run --rm hello-world
            - docker run --rm alpine echo "Docker funcional na AMI"

      # Repete a conferencia na AMI final. O daemon.json podia estar certo na
      # build e nao ter sobrevivido ao snapshot.
      - name: TestDaemonConfigOnAmi
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -eu
              if ! docker info 2>/dev/null | grep -q 'Live Restore Enabled: true'; then
                echo "ERRO: a AMI final nao esta com live-restore ativo."
                echo "ERRO: o daemon.json nao sobreviveu ao snapshot."
                exit 1
              fi
              echo "OK: daemon.json valendo na AMI final."
              echo "INFO: rede do docker0: $(docker network inspect bridge | grep '"Subnet"' | head -1 | cut -d'"' -f4)"

# ---------------------------------------------------------------------------
# DECISAO: o pool de enderecos ficou no PADRAO do Docker (15/10/2026)
#
# A versao 1.0.0 deste componente fixava default-address-pools em 10.100.0.0/16
# e 10.101.0.0/16. Foi REVERTIDO, e vale registrar por que - a justificativa
# original estava errada.
#
# O QUE SE DIZIA: o pool padrao do Docker colide com a VPC de producao.
#
# POR QUE ESTA ERRADO: o Docker aloca a partir de 172.17.0.0/16 e sobe -
# 172.18, 172.19 ... ate 172.31 - e depois passa para 192.168.0.0/20 em
# diante. A producao e 172.16.0.0/16, que NAO esta no caminho de alocacao.
# Risco zero, nao "intermitente".
#
# AS COLISOES QUE EXISTEM DE FATO, e por que nao justificam:
#   172.31.0.0/16 (em uso, ver CIDRs.txt) exige 15 redes criadas antes
#   as faixas 192.168.x do escritorio exigem mais de 15
# Cada projeto docker-compose cria uma rede. Chegar a 15 redes simultaneas
# significa dezenas de stacks no mesmo host, o que nao e o caso aqui.
#
# E o mecanismo da falha nao e o que a intuicao sugere: o trafego que SAI do
# container passa por MASQUERADE e chega ao destino com o IP do host, entao o
# IP do container nunca aparece na rede. O problema seria de DESTINO - uma
# rota local "172.x dev docker0" e mais especifica que a rota da VPC e
# capturaria trafego que deveria sair pela eth0. Mas isso exige a sobreposicao
# acontecer, e ela exige as 15 redes.
#
# O QUE PESOU PARA VOLTAR AO PADRAO: menos peca para manter, e divergir do
# padrao tem custo proprio - quem for depurar roteamento espera 172.17 e
# estranha qualquer outra coisa.
#
# SE UM DIA PRECISAR VOLTAR A FIXAR: o motivo legitimo seria uma instancia
# precisar ALCANCAR faixa 192.168.x do escritorio (hoje o fluxo e o contrario,
# escritorio -> ALB -> instancia) ou peering novo com VPC em 172.17-172.31.
# Nesse caso, escrever o daemon.json ANTES do apt install, porque o
# default-address-pools nao se aplica a rede bridge que o daemon ja criou.
# ---------------------------------------------------------------------------
