# Componente do EC2 Image Builder.
#
# Um componente e uma receita de passos. As fases possiveis sao:
#   build     - executa durante a construcao da imagem
#   validate  - verifica a imagem antes de criar a AMI
#   test      - executa numa instancia lancada a partir da AMI pronta
#
# ---------------------------------------------------------------------------
# VERSAO 1.0.1 - acrescenta a FONTE DE TEMPO, decidido em 19/10/2026.
#
# POR QUE ENTROU AQUI e nao num componente novo: este componente ja trata de
# tempo, e e usado pelas DUAS linhagens base - as filhas herdam. Um componente
# novo exigiria acrescenta-lo as receitas, o que substitui receita do mesmo
# jeito, sem ganho nenhum e com uma peca a mais para manter.
#
# O PROBLEMA QUE ISTO RESOLVE, diagnosticado na operationalflow em 19/10:
#
#   System clock synchronized: no      NTP service: active
#   ^- 169.254.169.123   Stratum 3  Reach 377  +719ms   <- "-" = NAO combinada
#   ^? ntp-nts-*.canonical  Stratum 0  Reach 0          <- nunca respondeu
#
# A imagem do Ubuntu vem com CINCO pools NTS da Canonical marcados "prefer",
# mais o servico da AWS tambem "prefer". As fontes da Canonical exigem
# TCP 4460 (NTS key establishment, RFC 8915) e a saida do security group e
# restrita a 443/80 - entao sao inalcancaveis. Com varias fontes preferidas e
# so uma alcancavel, o chrony media a da AWS e NAO a usava para corrigir.
#
# O servico de tempo da AWS fica em 169.254.169.123, LINK-LOCAL, que nao
# depende de rota nem de security group. Deixando-o como fonte unica, o chrony
# o seleciona.
#
# NAO abrir a 4460 para a Canonical: seriam seis /32 de terceiro, sem prefix
# list gerenciada, que mudam sem aviso - e alargaria a restricao de saida que
# mitiga o risco R07.
# ---------------------------------------------------------------------------

name: fuso-horario
description: Fuso horario America/Sao_Paulo e fonte de tempo no servico da AWS
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: DefinirFuso
        action: ExecuteBash
        inputs:
          commands:
            - timedatectl set-timezone America/Sao_Paulo

      - name: FixarFonteDeTempoDaAWS
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail

              # As fontes da Canonical podem estar em dois lugares, dependendo
              # da versao da imagem: no chrony.conf ou em sources.d/. Tratar os
              # dois, sem falhar se um nao existir.
              if [ -f /etc/chrony/chrony.conf ]; then
                sed -i 's/^pool .*ubuntu\.com/#&/' /etc/chrony/chrony.conf
                sed -i 's/^server .*ubuntu\.com/#&/' /etc/chrony/chrony.conf
              fi

              rm -f /etc/chrony/sources.d/*ubuntu*.sources || true

              # Garantir o servico da AWS declarado, de forma idempotente: se
              # ja existir no chrony.conf, nao duplica.
              if ! grep -rq '169\.254\.169\.123' /etc/chrony/ 2>/dev/null; then
                echo 'server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4' \
                  > /etc/chrony/sources.d/aws-time-sync.sources
              fi

              echo "--- fontes configuradas ---"
              grep -rh '^\(server\|pool\)' /etc/chrony/ || true

  - name: validate
    steps:
      # A CHECAGEM E SIMPLES DE PROPOSITO.
      #
      # Das tres falhas de build do componente de Docker, UMA foi bug real e
      # DUAS foram o proprio codigo de validacao - um "grep -A3" que cortava
      # antes do campo e reprovava configuracao correta. A licao registrada:
      # verificador complicado vira fonte de falha em vez de detector.
      #
      # Entao NAO se verifica "synchronized: yes": sincronizar leva minutos e
      # depende do relogio inicial da instancia de build, o que tornaria a
      # build intermitente - o pior tipo de falha.
      #
      # O que se prova e o EFEITO da configuracao: sobrou exatamente UMA fonte,
      # e e a da AWS. Isso e deterministico e falha se o sed nao pegou.
      - name: ConferirFonteUnica
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail

              if grep -rq 'ubuntu\.com' /etc/chrony/ 2>/dev/null; then
                echo "ERRO: ainda ha fonte da Canonical configurada:"
                grep -rn 'ubuntu\.com' /etc/chrony/ || true
                exit 1
              fi

              if ! grep -rq '169\.254\.169\.123' /etc/chrony/ 2>/dev/null; then
                echo "ERRO: o servico de tempo da AWS nao esta configurado"
                exit 1
              fi

              echo "OK: fonte de tempo unica = 169.254.169.123 (link-local)"

      - name: ConferirFuso
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              FUSO=$(timedatectl show --property=Timezone --value)
              echo "fuso: ${FUSO}"
              if [ "${FUSO}" != "America/Sao_Paulo" ]; then
                echo "ERRO: fuso esperado America/Sao_Paulo"
                exit 1
              fi
