# EC2 Image Builder component.
#
# A component is a recipe of steps. The possible phases are:
#   build     - runs during image construction
#   validate  - checks the image before creating the AMI
#   test      - runs on an instance launched from the finished AMI
#
# ---------------------------------------------------------------------------
# VERSION 1.0.1 - adds the TIME SOURCE, decided on 2026-10-19.
#
# WHY IT WENT HERE instead of a new component: this component already deals
# with time, and it is used by BOTH base lineages - the children inherit. A
# new component would require adding it to the recipes, which replaces the
# recipe just the same, with no gain and one more piece to maintain.
#
# THE PROBLEM THIS SOLVES, diagnosed on the integration worker:
#
#   System clock synchronized: no      NTP service: active
#   ^- 169.254.169.123   Stratum 3  Reach 377  +719ms   <- "-" = NOT combined
#   ^? ntp-nts-*.canonical  Stratum 0  Reach 0          <- never responded
#
# The Ubuntu image ships with FIVE Canonical NTS pools marked "prefer", plus
# the AWS service also "prefer". The Canonical sources require TCP 4460 (NTS
# key establishment, RFC 8915) and the security group egress is restricted to
# 443/80 - so they are unreachable. With several preferred sources and only
# one reachable, chrony averaged the AWS one and did NOT use it to correct.
#
# The AWS time service lives at 169.254.169.123, LINK-LOCAL, which does not
# depend on a route or on a security group. Leaving it as the single source,
# chrony selects it.
#
# Do NOT open 4460 to Canonical: it would be six third-party /32s, with no
# managed prefix list, that change without notice - and it would widen the
# egress restriction that mitigates the lateral-movement risk.
# ---------------------------------------------------------------------------

name: timezone
description: America/Sao_Paulo timezone and time source on the AWS service
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: SetTimezone
        action: ExecuteBash
        inputs:
          commands:
            - timedatectl set-timezone America/Sao_Paulo

      - name: PinAwsTimeSource
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail

              # The Canonical sources may live in two places, depending on the
              # image version: in chrony.conf or in sources.d/. Handle both,
              # without failing if one does not exist.
              if [ -f /etc/chrony/chrony.conf ]; then
                sed -i 's/^pool .*ubuntu\.com/#&/' /etc/chrony/chrony.conf
                sed -i 's/^server .*ubuntu\.com/#&/' /etc/chrony/chrony.conf
              fi

              rm -f /etc/chrony/sources.d/*ubuntu*.sources || true

              # Ensure the AWS service is declared, idempotently: if it already
              # exists in chrony.conf, do not duplicate it.
              if ! grep -rq '169\.254\.169\.123' /etc/chrony/ 2>/dev/null; then
                echo 'server 169.254.169.123 prefer iburst minpoll 4 maxpoll 4' \
                  > /etc/chrony/sources.d/aws-time-sync.sources
              fi

              echo "--- configured sources ---"
              grep -rh '^\(server\|pool\)' /etc/chrony/ || true

  - name: validate
    steps:
      # THE CHECK IS SIMPLE ON PURPOSE.
      #
      # Of the three build failures of the Docker component, ONE was a real bug
      # and TWO were the validation code itself - a "grep -A3" that cut off
      # before the field and rejected correct configuration. The lesson on
      # record: a complicated checker becomes a source of failure instead of a
      # detector.
      #
      # So we do NOT check "synchronized: yes": synchronizing takes minutes and
      # depends on the build instance's initial clock, which would make the
      # build intermittent - the worst kind of failure.
      #
      # What we prove is the EFFECT of the configuration: exactly ONE source is
      # left, and it is the AWS one. That is deterministic and fails if the sed
      # did not take.
      - name: VerifySingleTimeSource
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail

              if grep -rq 'ubuntu\.com' /etc/chrony/ 2>/dev/null; then
                echo "ERROR: a Canonical source is still configured:"
                grep -rn 'ubuntu\.com' /etc/chrony/ || true
                exit 1
              fi

              if ! grep -rq '169\.254\.169\.123' /etc/chrony/ 2>/dev/null; then
                echo "ERROR: the AWS time service is not configured"
                exit 1
              fi

              echo "OK: single time source = 169.254.169.123 (link-local)"

      - name: VerifyTimezone
        action: ExecuteBash
        inputs:
          commands:
            - |
              set -euo pipefail
              TZ=$(timedatectl show --property=Timezone --value)
              echo "timezone: ${TZ}"
              if [ "${TZ}" != "America/Sao_Paulo" ]; then
                echo "ERROR: expected timezone America/Sao_Paulo"
                exit 1
              fi
