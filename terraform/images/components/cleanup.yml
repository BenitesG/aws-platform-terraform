# Componente de limpeza. DEVE SER O ULTIMO da receita.
#
# Isto nao e refinamento - e correcao. O erro classico da primeira golden
# image e capturar o snapshot com a identidade da maquina de build dentro.
# Resultado: TODA instancia criada da imagem nasce com os mesmos valores.
#
#   - chaves de host SSH identicas: o aviso de "host key changed" deixa de
#     significar algo e abre espaco para man-in-the-middle entre as maquinas
#   - machine-id duplicado: quebra o journald e ferramentas que identificam a
#     maquina por ele
#   - estado do cloud-init preenchido: a instancia nova nao executa a
#     inicializacao de primeiro boot
#
# Aproveitamos tambem para fixar a porta do SSH.

name: cleanup
description: Define a porta do SSH e limpa identidade e residuos antes do snapshot
schemaVersion: 1.0

phases:
  - name: build
    steps:

      # Porta do SSH em 65022.
      #
      # Isto muda apenas ONDE O SERVIDOR ESCUTA. Conexoes que SAEM da maquina
      # (git para o GitLab, por exemplo) continuam indo para a porta 22 do
      # destino - as duas coisas sao independentes.
      #
      # 65022 fica acima da faixa efemera do Linux (32768-60999), entao nao ha
      # risco de colisao com porta de origem de conexao.
      #
      # Beneficio hoje e zero: as instancias nao tem IP publico nem regra de
      # entrada, e o Session Manager nao usa SSH. O ganho aparece se algum
      # servidor ficar exposto. ATENCAO: se um dia houver regra de entrada, o
      # security group precisa liberar 65022, nao 22. E quem usar o tunel SSH
      # do SSM (AWS-StartSSHSession) precisa saber da porta.
      #
      # DOIS LUGARES, e isto nao e redundancia:
      #
      # 1) sshd_config.d - vale quando o sshd roda como servico tradicional
      #
      # 2) override do ssh.socket - A PARTIR DO UBUNTU 24.04 o SSH usa
      #    ATIVACAO POR SOCKET, e nesse modo o "Port" do sshd_config e
      #    IGNORADO: quem decide a porta e o ListenStream da unidade systemd.
      #    Sem este override a build passaria e o SSH continuaria na 22, sem
      #    erro nenhum - falha silenciosa.
      #
      # O "ListenStream=" vazio antes do valor novo nao e descuido: e o idioma
      # do systemd para LIMPAR a lista herdada antes de acrescentar. Sem ele,
      # a unidade escutaria nas duas portas.
      - name: SshPort
        action: ExecuteBash
        inputs:
          commands:
            - install -d -m 0755 /etc/ssh/sshd_config.d
            - printf 'Port 65022\n' > /etc/ssh/sshd_config.d/10-mb-port.conf
            - install -d -m 0755 /etc/systemd/system/ssh.socket.d
            - printf '[Socket]\nListenStream=\nListenStream=65022\n' > /etc/systemd/system/ssh.socket.d/10-mb-port.conf
            - systemctl daemon-reload

      # Diagnostico do SSH, NAO BLOQUEANTE.
      #
      # Historico: a versao 1.0.0 usava "sshd -t" e falhou com 255. Supus que
      # fosse a exigencia de caminho absoluto do OpenSSH e corrigi para
      # "/usr/sbin/sshd -t" na 1.0.1 - que falhou com 255 do mesmo jeito. A
      # hipotese estava errada, ou incompleta.
      #
      # Em vez de gastar mais builds adivinhando, os comandos abaixo IMPRIMEM
      # o diagnostico no log da build sem derrubar nada. Todos terminam em
      # "|| true", porque no ExecuteBash qualquer comando com saida diferente
      # de zero reprova o passo inteiro.
      #
      # Validar sintaxe aqui era zelo, nao necessidade: o arquivo escrito tem
      # uma linha. Se validacao for desejada, o lugar certo e a fase TEST, que
      # roda numa instancia lancada a partir da AMI pronta.
      - name: DiagnoseSshd
        action: ExecuteBash
        inputs:
          commands:
            - echo "=== binario ==="
            - ls -l /usr/sbin/sshd || true
            - echo "=== versao ==="
            - /usr/sbin/sshd -V 2>&1 || true
            - echo "=== teste de sintaxe (exit esperado 0) ==="
            - /usr/sbin/sshd -t 2>&1 || true
            - echo "=== codigo de saida do teste ==="
            - /usr/sbin/sshd -t > /dev/null 2>&1; echo "exit=$?"
            - echo "=== chaves de host presentes ==="
            - ls -l /etc/ssh/ssh_host_* 2>&1 || true
            - echo "=== ativacao por socket ==="
            - systemctl is-enabled ssh.socket 2>&1 || true
            - systemctl is-enabled ssh.service 2>&1 || true
            - echo "=== porta efetiva ==="
            - /usr/sbin/sshd -T 2>/dev/null | grep -i '^port' || true

      # Remove as chaves de host. O cloud-init regenera no primeiro boot de
      # cada instancia, dando identidade unica a cada maquina.
      - name: RemoveSshHostKeys
        action: ExecuteBash
        inputs:
          commands:
            - rm -f /etc/ssh/ssh_host_*

      # Zera (nao apaga) o machine-id. Arquivo vazio faz o systemd gerar um
      # novo no boot; arquivo ausente causa erro em algumas versoes.
      - name: ResetMachineId
        action: ExecuteBash
        inputs:
          commands:
            - truncate -s 0 /etc/machine-id
            - rm -f /var/lib/dbus/machine-id

      # Faz o cloud-init rodar do zero na proxima instancia.
      - name: CleanCloudInit
        action: ExecuteBash
        inputs:
          commands:
            - cloud-init clean --logs --seed

      - name: CleanAptAndLogs
        action: ExecuteBash
        inputs:
          commands:
            - apt-get clean
            - rm -rf /var/lib/apt/lists/*
            - find /var/log -type f -exec truncate -s 0 {} +
            - rm -f /root/.bash_history /home/ubuntu/.bash_history
